name: pages
on:
  push: { branches: [main] }
  workflow_dispatch:

permissions:
  contents: read

concurrency: { group: pages, cancel-in-progress: true }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # No install: the demo vendors its coastline and imports the library
      # in place, so the build is a copy with a size budget.
      - run: npm run build:demo
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only this job publishes, so only this job gets the write scopes.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
